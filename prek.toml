minimum_prek_version = "0.3.2"
default_language_version.python = "python3"

[[repos]]
repo = "builtin"
hooks = [
    {id = "trailing-whitespace"},
    {id = "end-of-file-fixer"},
    {id = "check-json"},
    {id = "check-toml"},
    {id = "check-yaml"},
    {id = "check-merge-conflict"},
    {id = "detect-private-key"},
    {id = "check-added-large-files"},
    {id = "check-case-conflict"},
    {id = "check-symlinks"},
    {id = "destroyed-symlinks"},
    {id = "fix-byte-order-marker"},
    {id = "mixed-line-ending"},
    {id = "check-executables-have-shebangs"},
    {id = "check-shebang-scripts-are-executable"},
]

[[repos]]
repo = "https://github.com/henryiii/validate-pyproject-schema-store"
rev = "2026.07.08"
hooks = [{id = "validate-pyproject"}]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "detect-secrets"
name = "Detect secrets"
entry = "uv run detect-secrets-hook --baseline .secrets.baseline"
language = "system"
types = ["text"]
exclude = "(^\\.secrets\\.baseline$|uv\\.lock$)"

[[repos.hooks]]
id = "vulture"
name = "Vulture"
entry = "uv run vulture"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "pyupgrade"
name = "pyupgrade"
entry = "uv run pyupgrade --py312-plus"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "flynt"
name = "flynt"
entry = "uv run flynt"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "deptry"
name = "deptry"
entry = "uv run deptry ."
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "check-sdist-isolated"
name = "Check sdist"
entry = "uv run check-sdist --inject-junk"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "ruff-check"
name = "Ruff check"
entry = "uv run ruff check --fix --quiet"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format"
entry = "uv run ruff format --quiet"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "mypy"
name = "mypy"
entry = "uv run mypy src/i_insist/"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "check-exception-handling"
name = "Check exception handling"
entry = "uv run python scripts/prek_hooks/check_exception_handling.py"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "check-private-test-imports"
name = "Forbid private imports in tests"
entry = "uv run python scripts/prek_hooks/check_private_test_imports.py --package i_insist"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest"
language = "system"
pass_filenames = false
always_run = true
