[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i-insist"
version = "0.2.1"
description = "Agent tool guards with provider-owned rules and human overrides."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ricardo Decal" }]
dependencies = []

[project.urls]
Repository = "https://github.com/crypdick/i-insist"
Issues = "https://github.com/crypdick/i-insist/issues"

[project.scripts]
i-insist = "i_insist.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/i_insist"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
